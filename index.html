<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guardias</title>
<meta name="theme-color" content="#1f5f8b">
<meta name="description" content="Calendario de guardias, preguardias y días libres.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guardias">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* Layout: una columna, solo tipografía y puntos; el único color fuerte son los días libres */
:root{
  --bg:#fbfbfa; --fg:#151515; --muted:#8a8a87; --faint:#c9c9c5; --line:#ececea;
  --free:#1f8a5a; --free-soft:#e3f3ea; --guard:#d23a3a; --pre:#d9922b;
  --font:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f0f10; --fg:#ededec; --muted:#7d7d7a; --faint:#3b3b3a; --line:#1f1f20;
  --free:#4fc98d; --free-soft:#13281d; --guard:#ff6b6b; --pre:#f0b44f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f0f10; --fg:#ededec; --muted:#7d7d7a; --faint:#3b3b3a; --line:#1f1f20;
  --free:#4fc98d; --free-soft:#13281d; --guard:#ff6b6b; --pre:#f0b44f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:36px}
header{display:none}
h2{font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.next{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0!important}
.chip{display:flex;align-items:baseline;gap:5px;padding:6px 10px;border-radius:999px;background:var(--free-soft);color:var(--free);font-variant-numeric:tabular-nums}
.chip b{font-weight:600;font-size:.95rem}
.chip small{font-size:.75rem}
.chip small:last-child{display:none}
.chip.hol{background:transparent;box-shadow:inset 0 0 0 1px var(--free)}
.banner{font-size:.9rem;color:var(--muted);border-left:2px solid var(--pre);padding:2px 0 2px 12px}
.cal{display:flex;flex-direction:column}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.head h3{font-size:1.6rem;font-weight:500;letter-spacing:-.02em;margin:0;text-transform:capitalize}
.nav{display:flex;gap:2px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.nav button{width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:1.25rem}
.nav .today{width:auto;padding:0 10px;font-size:.8rem}
.nav button:hover{color:var(--fg)}
button:focus-visible{outline:1.5px solid var(--fg);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px}
.dow{text-align:center;font-size:.7rem;color:var(--muted);padding-bottom:8px}
.d{aspect-ratio:1;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0;color:var(--muted);font-variant-numeric:tabular-nums}
.d .n{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:.95rem}
.d .t{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;font-size:0;overflow:hidden}
.d.servicio .t{display:none}
.d.libre{color:var(--free)}
.d.libre .n{background:var(--free-soft);font-weight:600}
.d.libre .t{display:none}
.d.guardia{color:var(--fg)}
.d.guardia .t{background:var(--guard)}
.d.preguardia{color:var(--fg)}
.d.preguardia .t{background:var(--pre)}
.d.empty{cursor:default}
.d.now .n{box-shadow:inset 0 0 0 1.5px var(--fg)}

.d.hol .n{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.past{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.78rem;color:var(--muted);margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;outline:none!important}
.note{font-size:.78rem;color:var(--muted);margin:0;max-width:44ch}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px}
.panel h4{font-size:1.15rem;font-weight:500;margin:0;text-transform:capitalize}
.panel p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.act{text-align:left;padding:13px 0;border-top:1px solid var(--line);font-size:.95rem}
.act.primary{color:var(--guard)}
#aClose{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.d .n{transition:background .15s}.d:not(.empty):active .n{background:var(--line)}}
</style>
</head>
<body>

<div class="wrap">

  <section>
    <h2>Próximos libres</h2>
    <div class="next" id="next"></div>
  </section>

  <section class="cal">
    <div class="head">
      <h3 id="month"></h3>
      <div class="nav">
        <button id="prev" aria-label="Mes anterior">‹</button>
        <button id="today" class="today">Hoy</button>
        <button id="nextm" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--free)"></i>Libre</span>
      <span><i style="background:var(--guard)"></i>Guardia</span>
      <span><i style="background:var(--pre)"></i>Preguardia</span>
      <span><i style="background:var(--faint)"></i>Servicio</span>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <h4 id="sTitle"></h4>
    <p id="sInfo"></p>
    <button class="act primary" id="aGuard">Marcar guardia en este día</button>
    <button class="act" id="aUnanchor">Quitar este cambio de guardia</button>
    <button class="act" id="aHol"></button>
    <button class="act" id="aClose">Cerrar</button>
  </div>
</div>

<script>
const KEY='dias-libres-v1';
const DAY=86400000;
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW=['L','M','M','J','V','S','D'];
const DOWL=['dom','lun','mar','mié','jue','vie','sáb'];

// Día como número entero (sin problemas de zona horaria)
const idx=(y,m,d)=>Math.round(Date.UTC(y,m,d)/DAY);
const fromIdx=i=>{const t=new Date(i*DAY);return{y:t.getUTCFullYear(),m:t.getUTCMonth(),d:t.getUTCDate(),w:t.getUTCDay()}};
const now=new Date();const TODAY=idx(now.getFullYear(),now.getMonth(),now.getDate());

let state=null;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const isExample=!state;
if(!state) state={anchors:[TODAY+2],addHol:[],remHol:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};

// Feriados nacionales de Venezuela
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return idx(y,mo-1,da)}
const holCache={};
function natHol(y){
  if(holCache[y])return holCache[y];
  const e=easter(y);
  const s=new Set([idx(y,0,1),e-48,e-47,e-3,e-2,idx(y,3,19),idx(y,4,1),idx(y,5,24),idx(y,6,5),idx(y,6,24),idx(y,9,12),idx(y,11,24),idx(y,11,25),idx(y,11,31)]);
  return holCache[y]=s;
}
const isHol=i=>state.addHol.includes(i)||(natHol(fromIdx(i).y).has(i)&&!state.remHol.includes(i));

// Guardia: el ciclo de 5 días sigue desde el cambio más reciente anterior o igual a ese día
function isGuard(i){
  const a=[...state.anchors].sort((x,y)=>x-y);
  let base=a[0];
  for(const x of a) if(x<=i) base=x;
  return ((i-base)%5+5)%5===0;
}
function status(i){
  if(isGuard(i))return'guardia';
  if(isGuard(i+1))return'preguardia';
  const w=fromIdx(i).w;
  if(w===0||w===6||isHol(i))return'libre';
  return'servicio';
}
const LABEL={guardia:'Guardia',preguardia:'Preguardia',libre:'Libre',servicio:'Servicio'};

let viewY=now.getFullYear(),viewM=now.getMonth(),sel=null;

function renderNext(){
  const el=document.getElementById('next');el.innerHTML='';
  let n=0;
  for(let i=TODAY;i<TODAY+120&&n<8;i++){
    if(status(i)!=='libre')continue;
    const f=fromIdx(i),c=document.createElement('div');
    const wk=f.w===0||f.w===6;
    c.className='chip'+(wk?'':' hol');
    c.innerHTML=`<small>${i===TODAY?'hoy':DOWL[f.w]}</small><b>${f.d}</b><small>${MESES[f.m].slice(0,3)}</small>`;
    c.title=wk?'Fin de semana libre':'Feriado libre';
    el.appendChild(c);n++;
  }
}
function render(){
    document.getElementById('month').textContent=`${MESES[viewM]} ${viewY}`;
  const g=document.getElementById('grid');g.innerHTML='';
  DOW.forEach(d=>{const h=document.createElement('div');h.className='dow';h.textContent=d;g.appendChild(h)});
  const first=idx(viewY,viewM,1),lead=(fromIdx(first).w+6)%7,days=new Date(viewY,viewM+1,0).getDate();
  for(let k=0;k<lead;k++){const e=document.createElement('div');e.className='d empty';g.appendChild(e)}
  for(let d=1;d<=days;d++){
    const i=first+d-1,s=status(i),b=document.createElement('button');
    b.className=`d ${s}`+(i===TODAY?' now':'')+(i<TODAY?' past':'')+(state.anchors.includes(i)?' anchor':'')+(isHol(i)?' hol':'');
    b.innerHTML=`<span class="n">${d}</span><span class="t">${LABEL[s]}</span>`;
    b.setAttribute('aria-label',`${d} de ${MESES[viewM]}: ${LABEL[s]}${isHol(i)?', feriado':''}`);
    b.onclick=()=>openSheet(i);
    g.appendChild(b);
  }
  renderNext();
}
function openSheet(i){
  sel=i;const f=fromIdx(i),s=status(i);
  document.getElementById('sTitle').textContent=`${DOWL[f.w]} ${f.d} de ${MESES[f.m]}`;
  document.getElementById('sInfo').textContent=({guardia:'Día de guardia.',preguardia:'Preguardia: va al hospital.',libre:'Día libre.',servicio:'Servicio normal.'})[s]+(isHol(i)?' Es feriado.':'');
  document.getElementById('aGuard').hidden=s==='guardia'&&!(isExample&&!state.touched);
  document.getElementById('aUnanchor').hidden=!(state.anchors.includes(i)&&state.anchors.length>1);
  document.getElementById('aHol').textContent=isHol(i)?'Quitar feriado':'Marcar como feriado';
  document.getElementById('sheet').hidden=false;
  document.getElementById('aGuard').focus();
}
const close=()=>{document.getElementById('sheet').hidden=true};
document.getElementById('aGuard').onclick=()=>{
  if(isExample&&!state.touched){state.anchors=[sel]}
  else if(!state.anchors.includes(sel)) state.anchors.push(sel);
  state.touched=true;save();close();render();
};
document.getElementById('aUnanchor').onclick=()=>{state.anchors=state.anchors.filter(x=>x!==sel);save();close();render()};
document.getElementById('aHol').onclick=()=>{
  const nat=natHol(fromIdx(sel).y).has(sel);
  if(isHol(sel)){state.addHol=state.addHol.filter(x=>x!==sel);if(nat&&!state.remHol.includes(sel))state.remHol.push(sel)}
  else{state.remHol=state.remHol.filter(x=>x!==sel);if(!nat)state.addHol.push(sel)}
  save();close();render();
};
document.getElementById('aClose').onclick=close;
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.getElementById('prev').onclick=()=>{viewM--;if(viewM<0){viewM=11;viewY--}render()};
document.getElementById('nextm').onclick=()=>{viewM++;if(viewM>11){viewM=0;viewY++}render()};
document.getElementById('today').onclick=()=>{viewY=now.getFullYear();viewM=now.getMonth();render()};
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
